version: "3.8"

services:

  mysql:

    image: mysql:8

    container_name: mysql-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Root123
      MYSQL_DATABASE: employeedb

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3307:3306"

  springboot-app:

    build: .

    container_name: springboot-app

    restart: always

    depends_on:
      - mysql

    environment:
      DB_URL: jdbc:mysql://mysql:3306/employeedb
      DB_USERNAME: root
      DB_PASSWORD: Root123
      JWT_SECRET: MyVeryStrongJWTSecretKey

    ports:
      - "8080:8080"

  nginx:

    image: nginx:latest

    container_name: nginx-server

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - springboot-app

volumes:

  mysql_data:
